# RuboCop, pinned in the Gemfile, so a new cop arrives with a deliberate update rather than a run.
AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 120

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# the transport's loop and the tests read best as they stand
Metrics/MethodLength:
  Max: 25
  Exclude:
    - 'test/**/*'

Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'test/**/*'

Metrics/ClassLength:
  Max: 130
  Exclude:
    - 'test/**/*'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - '*.gemspec'

Metrics/ParameterLists:
  CountKeywordArgs: false
