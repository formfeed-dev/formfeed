name: Release

# A tag `v*` publishes every package at that version. npm and PyPI both use trusted publishing: each
# registry trusts this workflow in the `release` environment through GitHub's OIDC token, so there is
# no registry token anywhere, and npm attaches provenance by itself. Tags arrive together with the
# commit they point at, from Formfeed's main repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, pack and check without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # A tag that does not match the package versions publishes the wrong thing silently.
      - name: Check versions against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          fail() { echo "$1 is $2 but the tag is $tag" >&2; exit 1; }
          for dir in packages/cli packages/mcp packages/n8n-nodes-formfeed; do
            version=$(node -p "require('./$dir/package.json').version")
            [ "$version" = "$tag" ] || fail "$dir" "$version"
          done
          # the MCP registry entry names the npm version it installs, and the registry refuses a mismatch
          for field in version 'packages[0].version'; do
            value=$(node -p "require('./packages/mcp/server.json').$field")
            [ "$value" = "$tag" ] || fail "packages/mcp/server.json $field" "$value"
          done
          generated=$(node --input-type=module -e "console.log((await import('./tools/publish/packages.mjs')).VERSION)")
          [ "$generated" = "$tag" ] || fail tools/publish/packages.mjs "$generated"
          python_version=$(grep -m1 '^version = ' packages/sdk-python/pyproject.toml | cut -d'"' -f2)
          [ "$python_version" = "$tag" ] || fail packages/sdk-python/pyproject.toml "$python_version"
          module_version=$(grep -m1 '^__version__ = ' packages/sdk-python/src/formfeed/__init__.py | cut -d'"' -f2)
          [ "$module_version" = "$tag" ] || fail packages/sdk-python/src/formfeed/__init__.py "$module_version"

      - run: pnpm nx run-many -t bundle -p cli mcp n8n-nodes-formfeed publish
      # installs every tarball into an empty project and runs the documented examples first
      - run: pnpm nx run-many -t smoke -p cli mcp n8n-nodes-formfeed publish

      # trusted publishing needs npm 11.5.1 or newer; Node 24 ships it
      - name: Publish to npm
        run: |
          set -euo pipefail
          flags=(--access public --provenance)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          # dependency order: a package is never published before the ones it depends on
          for dir in dist/packages/sdk-ts dist/packages/engine dist/packages/devkit dist/packages/testing \
                     dist/packages/cli dist/packages/mcp dist/packages/n8n-nodes-formfeed; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # a re-run after a partial failure skips what already went out; a dry run between two
            # releases packs instead, because npm refuses even a dry-run publish over an existing version
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run "./$dir"; fi
              continue
            fi
            npm publish "${flags[@]}" "./$dir"
          done

  # The Activepieces piece is built in a checkout of their repository at the release its build.mjs pins,
  # because their framework is no longer published to npm; the bundle carries the tag's version from
  # tools/publish/packages.mjs, which the npm job checks against the tag.
  activepieces:
    # after the npm job, whose check stops a tag that does not match the versions
    needs: [npm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # the root's packageManager is pnpm, which this job never installs; build.mjs needs only bun
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: node packages/activepieces-piece/build.mjs
      - name: Publish to npm
        run: |
          set -euo pipefail
          dir=dist/packages/activepieces-piece
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
            if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run "./$dir"; fi
          elif [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --provenance --dry-run "./$dir"
          else
            npm publish --access public --provenance "./$dir"
          fi

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
        working-directory: packages/sdk-python
      - run: python -m twine check --strict dist/*
        working-directory: packages/sdk-python
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: env.DRY_RUN != 'true'
        with:
          packages-dir: packages/sdk-python/dist
          skip-existing: true

  # The .NET, Java and Ruby SDKs (plan 34) publish from here too, each only once its registry is set
  # up: NuGet when the repository variable NUGET_USER names the nuget.org account whose trusted
  # publishing policy names this workflow, Maven Central when the Central Portal token and the GPG key
  # are secrets of the `release` environment, RubyGems when the variable RUBYGEMS_OWNER holds the id
  # of the rubygems.org account that owns the gem (shown on its Pending Trusted Publishers page; the
  # first push through a pending trusted publisher must name it, and a pending publisher is valid for
  # about 12 hours, so it is made right before the tag). Until then each job is skipped, and a
  # release publishes the other packages as before. The Go SDK needs nothing here: the module proxy
  # reads the tags of its mirror, formfeed-dev/formfeed-go.
  nuget:
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check the version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' packages/sdk-dotnet/src/Formfeed/Formfeed.csproj)
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "Formfeed.csproj is $version but the tag is $GITHUB_REF_NAME" >&2; exit 1; }
      # on the runner rather than in Docker: GITHUB_ACTIONS switches on Source Link and the
      # deterministic CI build
      - run: dotnet pack packages/sdk-dotnet/src/Formfeed -c Release -o dist/nuget
      - name: NuGet login (the workflow's OIDC token for a key valid one hour)
        if: env.DRY_RUN != 'true'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # the symbols package beside it goes along; a version nuget.org has already is left alone
      - name: Publish to NuGet
        if: env.DRY_RUN != 'true'
        run: dotnet nuget push "dist/nuget/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Check for the Central Portal token
        id: account
        run: |
          if [ -n "$MAVEN_CENTRAL_USERNAME" ] && [ -n "$MAVEN_GPG_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::MAVEN_CENTRAL_USERNAME or MAVEN_GPG_KEY is not set, so dev.formfeed:formfeed is not published (plan 34)'
          fi
      - uses: actions/checkout@v5
        if: steps.account.outputs.present == 'true'
      - name: Check the version against the tag
        if: steps.account.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(sed -n '0,/<version>/s:.*<version>\(.*\)</version>.*:\1:p' packages/sdk-java/pom.xml)
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "pom.xml is $version but the tag is $GITHUB_REF_NAME" >&2; exit 1; }
      # in the image the SDK's checks use (Maven 3.10, which its plugins need); the release profile signs
      # with the key from MAVEN_GPG_KEY and uploads to the Central Portal, waiting until it is published
      - name: Publish to Maven Central
        if: steps.account.outputs.present == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' '<settings><servers><server><id>central</id>' \
            '<username>${env.MAVEN_CENTRAL_USERNAME}</username><password>${env.MAVEN_CENTRAL_PASSWORD}</password>' \
            '</server></servers></settings>' > "$RUNNER_TEMP/settings.xml"
          goals=(deploy)
          if [ "$DRY_RUN" = "true" ]; then goals=(verify -Dgpg.skip); fi
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/settings.xml:/settings.xml:ro" \
            -e MAVEN_CENTRAL_USERNAME -e MAVEN_CENTRAL_PASSWORD -e MAVEN_GPG_KEY -e MAVEN_GPG_PASSPHRASE \
            -w /repo/packages/sdk-java maven:3-eclipse-temurin-25 \
            mvn -B -ntp -s /settings.xml -Prelease "${goals[@]}"

  rubygems:
    if: vars.RUBYGEMS_OWNER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check the version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' packages/sdk-ruby/lib/formfeed/version.rb)
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "version.rb is $version but the tag is $GITHUB_REF_NAME" >&2; exit 1; }
      - run: gem build formfeed.gemspec
        working-directory: packages/sdk-ruby
      # the credentials step rubygems/release-gem runs, without its `rake release`, which would tag and
      # push a branch from a tag checkout. `owner` (2.2.0 and later) names the account the first push
      # of a new gem goes to, which RubyGems requires of a pending trusted publisher; the action leaves
      # it out of the request when it is empty, and a gem that exists needs none
      - name: RubyGems credentials (the workflow's OIDC token)
        if: env.DRY_RUN != 'true'
        uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f # v2.2.0
        with:
          owner: ${{ vars.RUBYGEMS_OWNER }}
      - name: Publish to RubyGems
        if: env.DRY_RUN != 'true'
        working-directory: packages/sdk-ruby
        run: |
          set -euo pipefail
          version=$(ruby -r ./lib/formfeed/version -e 'print Formfeed::VERSION')
          if gem info formfeed --remote --exact --version "$version" | grep -q "formfeed ($version)"; then
            echo "formfeed $version is already published"
          else
            gem push "formfeed-$version.gem"
          fi

  # The official MCP registry lists the server under io.github.formfeed-dev: the registry trusts this
  # repository's OIDC token for its owner's namespace, and checks that the npm package it names carries
  # the same `mcpName`, so it runs after npm. A version the registry already has is left alone.
  mcp-registry:
    needs: [npm]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate packages/mcp/server.json
      - run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP registry
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/mcp/server.json').version")
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.formfeed-dev%2Fformfeed/versions/$version"; then
            echo "io.github.formfeed-dev/formfeed $version is already in the registry"
            exit 0
          fi
          # the registry looks the version up on npm, which shows a new release only after a while
          # (v0.3.8 failed with a 404 seconds after the npm job, v0.3.31 after waiting five minutes,
          # two minutes before npm served it); wait up to fifteen minutes for it
          for attempt in $(seq 1 90); do
            if curl -sf -o /dev/null "https://registry.npmjs.org/@formfeed%2Fmcp/$version"; then break; fi
            [ "$attempt" = 90 ] && { echo "@formfeed/mcp@$version did not appear on npm" >&2; exit 1; }
            sleep 10
          done
          ./mcp-publisher publish packages/mcp/server.json

  github-release:
    needs: [npm, pypi, activepieces]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            Published to npm and PyPI from this tag. What changed: https://docs.formfeed.dev/changelog
