name: Release

# A tag `v*` publishes every package at that version. npm and PyPI both use trusted publishing: each
# registry trusts this workflow in the `release` environment through GitHub's OIDC token, so there is
# no registry token anywhere, and npm attaches provenance by itself. Tags arrive together with the
# commit they point at, from Formfeed's main repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, pack and check without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # A tag that does not match the package versions publishes the wrong thing silently.
      - name: Check versions against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          fail() { echo "$1 is $2 but the tag is $tag" >&2; exit 1; }
          for dir in packages/cli packages/mcp packages/n8n-nodes-formfeed; do
            version=$(node -p "require('./$dir/package.json').version")
            [ "$version" = "$tag" ] || fail "$dir" "$version"
          done
          # the MCP registry entry names the npm version it installs, and the registry refuses a mismatch
          for field in version 'packages[0].version'; do
            value=$(node -p "require('./packages/mcp/server.json').$field")
            [ "$value" = "$tag" ] || fail "packages/mcp/server.json $field" "$value"
          done
          generated=$(node --input-type=module -e "console.log((await import('./tools/publish/packages.mjs')).VERSION)")
          [ "$generated" = "$tag" ] || fail tools/publish/packages.mjs "$generated"
          python_version=$(grep -m1 '^version = ' packages/sdk-python/pyproject.toml | cut -d'"' -f2)
          [ "$python_version" = "$tag" ] || fail packages/sdk-python/pyproject.toml "$python_version"
          module_version=$(grep -m1 '^__version__ = ' packages/sdk-python/src/formfeed/__init__.py | cut -d'"' -f2)
          [ "$module_version" = "$tag" ] || fail packages/sdk-python/src/formfeed/__init__.py "$module_version"

      - run: pnpm nx run-many -t bundle -p cli mcp n8n-nodes-formfeed publish
      # installs every tarball into an empty project and runs the documented examples first
      - run: pnpm nx run-many -t smoke -p cli mcp n8n-nodes-formfeed publish

      # trusted publishing needs npm 11.5.1 or newer; Node 24 ships it
      - name: Publish to npm
        run: |
          set -euo pipefail
          flags=(--access public --provenance)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          # dependency order: a package is never published before the ones it depends on
          for dir in dist/packages/sdk-ts dist/packages/engine dist/packages/devkit dist/packages/testing \
                     dist/packages/cli dist/packages/mcp dist/packages/n8n-nodes-formfeed; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # a re-run after a partial failure skips what already went out; a dry run between two
            # releases packs instead, because npm refuses even a dry-run publish over an existing version
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run "./$dir"; fi
              continue
            fi
            npm publish "${flags[@]}" "./$dir"
          done

  # The Activepieces piece is built in a checkout of their repository at the release its build.mjs pins,
  # because their framework is no longer published to npm; the bundle carries the tag's version from
  # tools/publish/packages.mjs, which the npm job checks against the tag.
  activepieces:
    # after the npm job, whose check stops a tag that does not match the versions
    needs: [npm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # the root's packageManager is pnpm, which this job never installs; build.mjs needs only bun
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: node packages/activepieces-piece/build.mjs
      - name: Publish to npm
        run: |
          set -euo pipefail
          dir=dist/packages/activepieces-piece
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
            if [ "$DRY_RUN" = "true" ]; then npm pack --dry-run "./$dir"; fi
          elif [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --provenance --dry-run "./$dir"
          else
            npm publish --access public --provenance "./$dir"
          fi

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
        working-directory: packages/sdk-python
      - run: python -m twine check --strict dist/*
        working-directory: packages/sdk-python
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: env.DRY_RUN != 'true'
        with:
          packages-dir: packages/sdk-python/dist
          skip-existing: true

  # The official MCP registry lists the server under io.github.formfeed-dev: the registry trusts this
  # repository's OIDC token for its owner's namespace, and checks that the npm package it names carries
  # the same `mcpName`, so it runs after npm. A version the registry already has is left alone.
  mcp-registry:
    needs: [npm]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate packages/mcp/server.json
      - run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP registry
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/mcp/server.json').version")
          if curl -sf -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.formfeed-dev%2Fformfeed/versions/$version"; then
            echo "io.github.formfeed-dev/formfeed $version is already in the registry"
            exit 0
          fi
          ./mcp-publisher publish packages/mcp/server.json

  github-release:
    needs: [npm, pypi, activepieces]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            Published to npm and PyPI from this tag. What changed: https://docs.formfeed.dev/changelog
