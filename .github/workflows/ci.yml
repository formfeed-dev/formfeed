name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint and unit tests, then build every npm package and try it the way a user installs it
      - run: pnpm nx run-many -t lint test bundle smoke --exclude sdk-python

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest httpx pydantic
      - run: python -m pytest -q
        working-directory: packages/sdk-python
      - name: Build and check the distribution
        if: matrix.python == '3.12'
        working-directory: packages/sdk-python
        run: |
          pip install build twine
          python -m build
          python -m twine check --strict dist/*
